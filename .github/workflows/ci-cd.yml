name: CIFAR-10 CNN CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      # GitHub repository ka code checkout karo
      - name: Checkout repository
        uses: actions/checkout@v6

      # Docker Hub mein login karo
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Docker Buildx setup karo
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Docker image build aur Docker Hub par push karo
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cifar10-cnn:latest

          # Docker build cache
          cache-from: type=gha
          cache-to: type=gha,mode=max